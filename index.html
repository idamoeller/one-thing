<style>
:root{
  --ink:#101314; --ink-mid:#4C5654; --muted:#8C9295;
  --surface:#F3F4F5; --white:#FFFFFF; --hairline:#E6E8E9; --border:#DCDFE1;
  --chip-border:#C9CDCF; --track:#EDEFF0; --ticks:#D5D9DB;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);background:var(--surface);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea{font-family:inherit;}
button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

.shell{max-width:540px;margin:0 auto;min-height:100vh;}
.hdr{display:flex;align-items:center;gap:14px;height:54px;padding:0 20px;border-bottom:1px solid var(--hairline);}
.hbtn{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);padding:6px 0;}
.hback{font-size:13px;letter-spacing:0;padding:6px 4px 6px 0;}
.htally{color:var(--muted);}
.hspace{flex:1;}

.bodywrap{padding:26px 20px 30px;}
.bodywrap.auth{padding-top:60px;display:flex;flex-direction:column;gap:22px;}

.h1{font-family:var(--sans);font-weight:600;font-size:26px;line-height:1.16;letter-spacing:.02em;text-transform:uppercase;margin:0 0 22px;}
.emptyline{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 0;}

.flash{background:var(--white);border:1px solid var(--border);border-radius:2px;padding:10px 12px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:20px;}

/* auth */
.field{display:flex;flex-direction:column;}
.flabel{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.finput{width:100%;background:transparent;border:none;border-bottom:1px solid var(--chip-border);
  font-size:16px;font-weight:500;color:var(--ink);padding:8px 0 11px;}
.finput:focus{outline:none;border-bottom-color:var(--ink);}
.finput::placeholder{color:var(--muted);}
.anote{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);margin:0;}

/* textarea */
.dump{width:100%;background:transparent;border:none;border-bottom:1px solid var(--chip-border);
  font-size:18px;font-weight:500;line-height:1.35;letter-spacing:.01em;text-transform:uppercase;
  color:var(--ink);padding:0 0 12px;resize:none;min-height:74px;margin-bottom:6px;}
.dump:focus{outline:none;border-bottom-color:var(--ink);}
.dump::placeholder{color:var(--muted);text-transform:uppercase;}

/* chip rows */
.dial{display:flex;align-items:center;gap:10px;margin-top:14px;}
.dial .clbl{width:62px;flex:none;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.chips{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.chips.two{grid-template-columns:repeat(2,1fr);}
.chips.wrap{display:flex;flex-wrap:wrap;}
.chips.wrap .chip{flex:0 1 auto;min-height:36px;padding-left:12px;padding-right:12px;}
.tagsdial{align-items:flex-start;}
.tagsdial .clbl{padding-top:12px;}
.chip{display:flex;align-items:center;justify-content:center;text-align:center;min-height:40px;padding:9px 3px;
  border-radius:2px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--chip-border);background:var(--white);color:var(--ink-mid);}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--white);}

/* buttons */
.btn{display:block;width:100%;background:var(--ink);color:var(--white);font-size:12px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;padding:17px 0;border-radius:2px;}
.btn[disabled]{opacity:.28;cursor:default;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);font-size:11px;letter-spacing:.14em;padding:15px 0;}
.addit{margin-top:24px;}
.pilebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.pilecta{margin-top:14px;}

/* list rows + pills */
.list{margin-top:8px;}
.row{display:flex;align-items:flex-start;gap:12px;padding:16px 0;border-bottom:1px solid var(--hairline);}
.row[data-act]{cursor:pointer;}
.rowtxt{flex:1;min-width:0;}
.rowtitle{font-size:13.5px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;line-height:1.35;color:var(--ink);}
.rowtitle.mid{color:var(--ink-mid);}
.rowx{color:var(--muted);font-size:16px;line-height:1;padding:2px 4px;flex:none;}
.pills{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px;}
.pcol{display:flex;flex-direction:column;gap:4px;min-width:0;}
.plabel{font-family:var(--mono);font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;}
.pval{display:block;width:100%;text-align:center;background:var(--white);border:1px solid var(--chip-border);border-radius:2px;
  font-family:var(--mono);font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);padding:5px 2px;}
.pval.on{background:var(--ink);border-color:var(--ink);color:var(--white);}
.pval.ro{cursor:default;}
.popts{display:flex;flex-direction:column;gap:4px;}

/* accordion (choose) */
.acc{margin-top:4px;}
.sec{border-top:1px solid var(--border);}
.accend{border-top:1px solid var(--border);}
.sechead{width:100%;text-align:left;display:flex;align-items:baseline;gap:12px;padding:20px 0;}
.secttl{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);}
.sechint{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.secbody{padding:0 0 22px;}
.dqlabel{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.dctx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.scroll{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pickrow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--hairline);cursor:pointer;}
.pickrow:last-child{border-bottom:none;}
.showone{margin-top:16px;}

/* settings */
.setnote{font-family:var(--mono);font-size:9px;line-height:1.6;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;}
.setblock{margin-top:16px;}
.setlabel{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.setgrid{display:grid;gap:6px;}
.sgrid{display:flex;flex-wrap:wrap;gap:6px;}
.sgrid .chip{flex:1 1 60px;}

/* tags */
.tagbox{position:relative;margin:4px 0 2px;}
.tagchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.tagchip{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--white);border-radius:2px;
  padding:6px 8px 6px 10px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;}
.tagchip .tagx{color:var(--white);opacity:.7;font-size:13px;line-height:1;padding:0 2px;}
.tagin{width:100%;background:transparent;border:none;border-bottom:1px dashed var(--chip-border);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);padding:8px 0 9px;}
.tagin:focus{outline:none;border-bottom-color:var(--ink);}
.tagin::placeholder{color:var(--muted);text-transform:uppercase;}
.tagdrop{position:absolute;left:0;right:0;top:100%;background:var(--white);border:1px solid var(--border);border-radius:2px;
  box-shadow:0 10px 26px rgba(16,19,20,.12);z-index:20;}
.tagdrop:empty{display:none;}
.tagopt{display:block;width:100%;text-align:left;padding:11px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--hairline);}
.tagopt:last-child{border-bottom:none;}
.tagopt.add{color:var(--ink-mid);}
.rowtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.tagpill{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mid);
  border:1px solid var(--chip-border);border-radius:2px;padding:3px 6px;background:var(--white);}
.taglist{display:flex;flex-direction:column;}
.tagrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hairline);}
.tagname{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);}
.tsmall{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 0;}
.tagren{flex:1;min-width:0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  background:var(--white);border:1px solid var(--chip-border);border-radius:2px;padding:6px 8px;}
.tagaddrow{display:flex;gap:8px;align-items:flex-end;margin-top:10px;}
.tagaddrow .tagin{flex:1;}
.btn.ghost.tagaddbtn{width:auto;padding:11px 16px;flex:none;}
/* inline editing on pile rows */
.rowedit,.rowcheck{color:var(--muted);padding:2px 4px;flex:none;display:flex;align-items:center;}
.rowcheck:hover{color:var(--ink);}
.tagpill.edit{display:inline-flex;align-items:center;gap:5px;padding-right:4px;}
.tagpx{color:var(--muted);font-size:11px;line-height:1;padding:0 2px;}
.tagplus{font-family:var(--mono);font-size:10px;line-height:1;color:var(--muted);border:1px dashed var(--chip-border);border-radius:2px;padding:3px 7px;}
.rowtagbox{position:relative;flex:1 1 140px;min-width:120px;}
.rowtagbox .tagin{padding:4px 0 5px;font-size:10px;}
.titleedit{display:flex;gap:8px;align-items:center;}
.titlein{flex:1;min-width:0;font-family:var(--sans);font-size:13.5px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;
  color:var(--ink);background:var(--white);border:1px solid var(--chip-border);border-radius:2px;padding:6px 8px;}
.titlein:focus{outline:none;border-color:var(--ink);}

/* menu */
.menuwrap{position:fixed;inset:0;z-index:10001;}
.menuback{position:absolute;inset:0;background:rgba(16,19,20,.18);}
.menu{position:absolute;top:12px;right:14px;width:240px;background:var(--surface);border:1px solid var(--border);
  border-radius:3px;padding:4px 16px;box-shadow:0 14px 34px rgba(16,19,20,.16);}
.menu button{display:block;width:100%;text-align:left;font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);padding:14px 0;border-bottom:1px solid rgba(140,146,149,.22);}
.menu button:last-child{border-bottom:none;}
.menu button.on{color:var(--ink);font-weight:600;}

/* focus */
.stage{position:fixed;inset:0;z-index:9999;background:var(--surface);color:var(--ink);
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
.stagein{width:100%;max-width:540px;margin:0 auto;flex:1;display:flex;flex-direction:column;
  padding:26px 22px 24px;padding-top:max(26px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));min-height:100%;}
.ftop{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.ftop .hbtn{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:4px 0;}
.fmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px 0;}
.ftitle{font-size:27px;font-weight:600;line-height:1.18;letter-spacing:.02em;text-transform:uppercase;text-align:center;margin:0;overflow-wrap:break-word;}
.fhead{display:flex;flex-direction:column;align-items:center;gap:13px;}
.ftags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.ftags .tagpill{font-size:9px;padding:4px 8px;}
.fedit{display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:none;background:none;padding:8px;margin-top:2px;opacity:.6;}
.fedit svg{width:15px;height:15px;}
.fhead.editing{width:100%;gap:14px;}
.ftitlein{width:100%;max-width:440px;font-family:var(--sans);font-size:20px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;text-align:center;color:var(--ink);background:var(--white);border:1px solid var(--chip-border);border-radius:2px;padding:11px 12px;}
.ftitlein:focus{outline:none;border-color:var(--ink);}
.fhead.editing .rowtags{width:100%;max-width:440px;margin-top:0;justify-content:center;}
.fhead.editing .tagpill{font-size:9px;padding:4px 8px;}
.fdone{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--white);background:var(--ink);border-radius:2px;padding:9px 22px;margin-top:2px;}
.timerbox{position:relative;width:224px;height:224px;}
.timerbox svg{position:absolute;inset:0;width:224px;height:224px;}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.settime{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px dashed var(--chip-border);padding:0 0 2px;}
.digits{font-size:42px;font-weight:600;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink);}
.facehint{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.tmodal{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);width:250px;background:var(--white);
  border:1px solid var(--ink);border-radius:3px;padding:14px;box-shadow:0 10px 26px rgba(16,19,20,.16);z-index:5;}
.tlabel{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.tmrow{display:flex;gap:8px;}
.tminput{flex:1;min-width:0;font-family:var(--mono);font-size:22px;font-weight:600;text-align:center;
  border:1px solid var(--chip-border);border-radius:2px;padding:10px 12px;color:var(--ink);background:var(--white);}
.tminput:focus{outline:none;border-color:var(--ink);}
.tdone{width:74px;flex:none;background:var(--ink);color:var(--white);border-radius:2px;
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;}
.fbottom{display:flex;flex-direction:column;}

  var DIMS=[["p","Priority",LEVELS,"priority"],["u","Urgency",LEVELS,"urgency"],
            ["e","Energy",LEVELS,"energy"],["t","Time",TIMES,"time"],

  function findTask(id){ for(var i=0;i<tasks.length;i++){ if(String(tasks[i].id)===String(id)) return tasks[i]; } return null; }
  function dimDefaultVal(field){ return field==="time"?"med":field==="context"?"work":field==="horizon"?"now":""; }

  // ---- plan / big 3 : date keys, labels & accessors ----
  var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var WEEKDAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  function pad2(n){ return n<10?("0"+n):(""+n); }
  function dayKey(d){ d=d?new Date(d):new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function isoWeekKey(d){
    d=d?new Date(d):new Date();
    var u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    var dayNum=(u.getUTCDay()+6)%7;                 // Mon=0 … Sun=6
    u.setUTCDate(u.getUTCDate()-dayNum+3);           // Thursday of this week
    var yr=u.getUTCFullYear();
    var firstThu=new Date(Date.UTC(yr,0,4));
    var fNum=(firstThu.getUTCDay()+6)%7;
    firstThu.setUTCDate(firstThu.getUTCDate()-fNum+3);
    return yr+"-W"+pad2(1+Math.round((u-firstThu)/604800000));
  }
  function mondayOf(d){ d=d?new Date(d):new Date(); var n=(d.getDay()+6)%7; var m=new Date(d); m.setDate(d.getDate()-n); return m; }
  function weekLabel(){ var m=mondayOf(); return "Week of "+MONTHS[m.getMonth()]+" "+m.getDate(); }
  function dayLabel(){ var d=new Date(); return WEEKDAYS[d.getDay()]+", "+MONTHS[d.getMonth()]+" "+d.getDate(); }
  function weekBig3(){ var w=plans.weeks[isoWeekKey()]; return (w&&Array.isArray(w.big3))?w.big3:[]; }
  function dayBig3(){ var x=plans.days[dayKey()]; return (x&&Array.isArray(x.big3))?x.big3:[]; }
  function setWeekBig3(arr){ var k=isoWeekKey(); if(!plans.weeks[k]) plans.weeks[k]={}; plans.weeks[k].big3=arr; saveSettings(); }
  function setDayBig3(arr){ var k=dayKey(); if(!plans.days[k]) plans.days[k]={}; plans.days[k].big3=arr; saveSettings(); }
  function inDayBig3(id){ var a=dayBig3(); for(var i=0;i<a.length;i++){ if(String(a[i])===String(id)) return true; } return false; }

  // ---- tags ----
  function normTag(s){ return String(s||"").replace(/\s+/g," ").replace(/^\s+|\s+$/g,""); }
  function tagEq(a,b){ return normTag(a).toLowerCase()===normTag(b).toLowerCase(); }
  function hasTag(list,name){ for(var i=0;i<list.length;i++){ if(tagEq(list[i],name)) return true; } return false; }
  function tagExact(q){ for(var i=0;i<tagVocab.length;i++){ if(tagEq(tagVocab[i],q)) return tagVocab[i]; } return null; }
  function tagMatches(q,have){
    var ql=normTag(q).toLowerCase(); if(!ql) return [];
    have=have||draft.tags;
    return tagVocab.filter(function(t){ return t.toLowerCase().indexOf(ql)===0 && !hasTag(have,t); });
  }
  function sortVocab(){ tagVocab.sort(function(a,b){ return a.toLowerCase()<b.toLowerCase()?-1:(a.toLowerCase()>b.toLowerCase()?1:0); }); }
  // Tags used on the most recently created tasks (tasks are loaded newest-first),

  function recentTags(have,limit){
    have=have||[]; limit=limit||8;
    var seen={}, out=[];
    function add(name){
      var canon=tagExact(name)||name, key=normTag(canon).toLowerCase();
      if(!key || seen[key] || hasTag(have,canon)) return;
      seen[key]=1; out.push(canon);
    }
    for(var i=0;i<tasks.length && out.length<limit;i++){
      var tg=tasks[i].tags||[];
      for(var j=0;j<tg.length && out.length<limit;j++){ add(tg[j]); }
    }
    for(var k=0;k<tagVocab.length && out.length<limit;k++){ add(tagVocab[k]); }
    return out;
  }
  function createTag(name){ name=normTag(name); if(!name || tagExact(name)) return; tagVocab.push(name); sortVocab(); saveSettings(); }
  // Dropdown options for a tag query. Defaults target the Collect draft; pass

      return h;
    }
    var m=tagMatches(q,have), exact=tagExact(q);
    for(i=0;i<m.length;i++){ h+='<button class="tagopt" data-act="'+pickAct+'"'+idAttr+' data-tag="'+esc(m[i])+'">'+esc(m[i])+'</button>'; }
    if(!exact) h+='<button class="tagopt add" data-act="'+addAct+'"'+idAttr+' data-tag="'+esc(q)+'">+ Add &ldquo;'+esc(q)+'&rdquo;</button>';
    return h;
  }

  var PENCIL='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.5 2.5l2 2L5.5 12.5H3.5v-2z"></path><path d="M10 4l2 2"></path></svg>';
  var CHECK='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5"></path></svg>';

  function loadMins(){
    try{
      var raw = window.localStorage ? localStorage.getItem(KEY) : null;
      if(!raw) return;
      var d = JSON.parse(raw);
      var m = parseInt(d && d.mins,10);
      if(!isNaN(m) && m>0 && m<=600){ timer.mins=m; timer.left=m*60; }
      if(d && knownSound(d.sound)) timerSound=d.sound;
    }catch(e){}
  }
  function saveMins(){
    try{
      if(window.localStorage){
        localStorage.setItem(KEY, JSON.stringify({mins:timer.mins,sound:timerSound}));
      }
    }catch(e){}
  }
  function normalize(t){ if(!t.doneAt && t.done_at) t.doneAt=t.done_at; if(!Array.isArray(t.tags)) t.tags=[]; t.inbox=!!t.inbox; t.must=!!t.must; return t; }
  function loadTasks(){
    if(!sb) return Promise.reject(new Error("Supabase client failed to load (check your connection)."));
    return sb.from("tasks").select("*").order("created_at",{ascending:false})
      .then(function(res){
        if(res.error) throw res.error;
        tasks = (res.data||[]).map(normalize);
      });
  }

  function inF(vals,v){ return !vals.length || !v || vals.indexOf(v)>-1; }
  // Tag filter is strict: with tags selected, a task must carry at least one of them.
  function tagOK(t){
    if(!filters.tags.length) return true;
    var tg=t.tags||[];
    for(var i=0;i<tg.length;i++){ if(hasTag(filters.tags,tg[i])) return true; }
    return false;
  }
  function matching(){
    return openTasks().filter(function(t){
      return inF(filters.priority,t.priority) && inF(filters.urgency,t.urgency)
          && inF(filters.energy,t.energy) && inF(filters.time,t.time)
          && inF(filters.context,t.context) && inF(filters.when,t.horizon)
          && tagOK(t);
    });
  }
  // Uniformly random pick from the pool (no priority weighting).
  function pickOne(list,skip){
    var pool=list.filter(function(t){ return skip==null || String(t.id)!==String(skip); });
    if(!pool.length) pool=list;
    if(!pool.length) return null;
    return pool[Math.floor(Math.random()*pool.length)];
  }
  // The candidate pool for the current pick "bucket": Zero-in matches, the
  // Dealer's-choice context, or (as a fallback) all open tasks.
  function bucketPool(){
    if(method==="filter") return matching();
    if(method==="pilefilter") return pileMatching(openTasks());
    if(method==="deal") return openTasks().filter(function(t){ return t.context===dealCtx; });
    return openTasks();
  }
  // Buckets that yield a random "next" task. A specific pick has no bucket, so
  // finishing/skipping one sends you back to the task list to choose again.
  function bucketIsRandom(){ return method==="filter" || method==="pilefilter" || method==="deal"; }
  // Go to the Choose screen with the "Specific task" list open, ready to pick.
  function gotoPickList(){ setScreen("choose", null); openSec="pick"; render(); }
  // Swap the focus screen to another task (keeps us on the timer), fresh timer.
  function advanceTo(id){
    activeId=id; resetTimer();
    try{ history.replaceState({screen:"focus",activeId:activeId},""); }catch(e){}
    render();
  }

  function pileChips(label,dim,opts){

  function pileTagRow(){
    var h='<div class="dial tagsdial"><span class="clbl">Tags</span><div class="chips wrap">';
    for(var i=0;i<tagVocab.length;i++){
      var on=hasTag(pileFilters.tags,tagVocab[i]);

  function pileFilterActive(){
    var f=pileFilters;
    return !!(f.must||f.d3||f.priority.length||f.urgency.length||f.energy.length||f.time.length||f.context.length||f.when.length||f.tags.length);
  }
  function pileFilterCount(){
    var f=pileFilters, n=0;
    if(f.must) n++; if(f.d3) n++;
    return n+f.priority.length+f.urgency.length+f.energy.length+f.time.length+f.context.length+f.when.length+f.tags.length;
  }
  // Strict AND across categories: a set dimension must match exactly (a task with
  // that dimension unset is excluded), tags need at least one overlap, flags require the mark.
  function pileMatching(list){
    var f=pileFilters;
    function ok(vals,v){ return !vals.length || (!!v && vals.indexOf(v)>-1); }
    return list.filter(function(t){
      if(f.must && !t.must) return false;
      if(f.d3 && !inDayBig3(t.id)) return false;
      if(!ok(f.priority,t.priority)) return false;
      if(!ok(f.urgency,t.urgency)) return false;
      if(!ok(f.energy,t.energy)) return false;
      if(!ok(f.time,t.time)) return false;
      if(!ok(f.context,t.context)) return false;
      if(!ok(f.when,t.horizon)) return false;
      if(f.tags.length){
        var tg=t.tags||[], has=false;
        for(var i=0;i<tg.length;i++){ if(hasTag(f.tags,tg[i])){ has=true; break; } }
        if(!has) return false;
      }
      return true;
    });
  }

  // Timestamp-based countdown: while running we track the wall-clock end time
  // (timer.endAt) and derive the remaining seconds from it, so the timer stays
  // accurate even when iOS Safari throttles or suspends the tab (backgrounded,
  // another app, screen locked). timer.left holds the frozen remaining when paused.
  function remaining(){ return Math.max(0, Math.ceil((timer.endAt-Date.now())/1000)); }
  function stopTimer(){
    if(timer.run && timer.endAt) timer.left=remaining();   // freeze remaining on pause
    timer.run=false; timer.endAt=null;
    if(timer.iv){ clearInterval(timer.iv); timer.iv=null; }
  }
  function resetTimer(){ stopTimer(); timer.left=timer.mins*60; }
  function startTimer(){
    if(timer.left<=0) timer.left=timer.mins*60;
    timer.endAt=Date.now()+timer.left*1000;
    timer.run=true;
    if(timer.iv) clearInterval(timer.iv);
    timer.iv=setInterval(tick,250);
  }
  function paintTimer(){
    var c=document.getElementById("clock"); if(c) c.textContent=clockText();
    var arc=document.getElementById("arc"); if(arc) arc.setAttribute("stroke-dasharray", arcDash());
  }
  function tick(){
    if(!timer.run) return;
    timer.left=remaining();
    if(timer.left<=0){ fireTimerEnd(); return; }
    paintTimer();
  }
  function fireTimerEnd(){
    stopTimer();
    timer.left=timer.mins*60;              // reset so a tap restarts
    timerAlarm();
    flash="Time. Stretch, then decide.";
    render();
    setTimeout(function(){ if(flash==="Time. Stretch, then decide."){ flash=""; if(screen==="focus") render(); } },2600);
  }
  // Resync the instant we're visible again — the throttled/suspended interval may
  // have missed ticks while backgrounded (and the timer may have elapsed away).
  function resyncTimer(){
    if(!timer.run || !timer.endAt) return;
    timer.left=remaining();
    if(timer.left<=0) fireTimerEnd();
    else paintTimer();
  }
  var audioCtx=null;
  function getAudio(){
    // Lazily create one shared AudioContext and resume it (must run in a user
    // gesture, e.g. tapping Start, to unlock audio on iOS/Safari).
    try{
      var C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      if(!audioCtx) audioCtx=new C();
      if(audioCtx.state==="suspended" && audioCtx.resume) audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }
  // Run fn(ac) once the shared context is actually running. On the first gesture
  // the context is created 'suspended' and resuming is async, so scheduling sound
  // immediately can be silent — wait for resume, then play.
  function withAudio(fn){
    var ac=getAudio(); if(!ac) return;
    var run=function(){ try{ fn(ac); }catch(e){} };
    if(ac.state==="suspended" && ac.resume){ try{ ac.resume().then(run,run); }catch(e){ run(); } }
    else run();
  }
  function beep(ac,freq,start,dur,vol,type){
    var o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001,start);
    g.gain.exponentialRampToValueAtTime(vol||0.22,start+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    o.start(start); o.stop(start+dur+0.05);
  }
  var SOUNDS=[
    ["bell","Bell",function(ac,t){ beep(ac,1318.51,t,0.5,0.28,"triangle"); beep(ac,1975.53,t,0.3,0.08,"sine"); }],
    ["chime","Chime",function(ac,t){ var p=[0,0.34,0.68,1.02]; for(var i=0;i<p.length;i++) beep(ac,(i%2)?660:880,t+p[i],0.32,0.22,"sine"); }],
    ["rising","Rising",function(ac,t){ var f=[659.25,783.99,1046.50]; for(var i=0;i<f.length;i++) beep(ac,f[i],t+i*0.09,0.42,0.20,"triangle"); }],
    ["ding","Ding",function(ac,t){ beep(ac,880,t,0.6,0.22,"sine"); }],
    ["none","None",null]
  ];
  function soundFn(key){ for(var i=0;i<SOUNDS.length;i++){ if(SOUNDS[i][0]===key) return SOUNDS[i][2]; } return SOUNDS[0][2]; }
  function knownSound(key){ for(var i=0;i<SOUNDS.length;i++){ if(SOUNDS[i][0]===key) return true; } return false; }
  function playSound(key){ var fn=soundFn(key); if(!fn) return; withAudio(function(ac){ fn(ac,ac.currentTime); }); }
  function timerAlarm(){
    playSound(timerSound);
    try{ if(navigator.vibrate) navigator.vibrate([180,90,180,90,180]); }catch(e){}
  }
  function completeChime(){
    // A short, bright rising bell for completing a task.
    withAudio(function(ac){
      var t0=ac.currentTime, freqs=[659.25,783.99,1046.50]; // E5, G5, C6
      for(var i=0;i<freqs.length;i++){
        var o=ac.createOscillator(), g=ac.createGain();
        o.type="triangle"; o.frequency.value=freqs[i];
        o.connect(g); g.connect(ac.destination);
        var s=t0+i*0.09;
        g.gain.setValueAtTime(0.0001,s);
        g.gain.exponentialRampToValueAtTime(0.22,s+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,s+0.45);
        o.start(s); o.stop(s+0.5);
      }
    });
  }
  // Prime Web Audio on the first user interaction so the timer alarm and the
  // completion chime are unlocked and ready (iOS/Safari need a user gesture).
  (function(){
    function prime(){ getAudio();
      document.removeEventListener("pointerdown",prime,true);
      document.removeEventListener("touchend",prime,true);
    }
    document.addEventListener("pointerdown",prime,true);
    document.addEventListener("touchend",prime,true);
  })();

  function confettiBurst(){
    var cvs=document.getElementById("cf"); if(!cvs || !cvs.getContext) return;
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    var ctx=cvs.getContext("2d");
    cvs.width=window.innerWidth; cvs.height=window.innerHeight;
    var colors=["#101314","#C9A227","#4C9A6A","#C25B4E","#3B6FB0"];
    var parts=[], ox=window.innerWidth/2, oy=window.innerHeight*0.42;
    for(var i=0;i<180;i++){
      var an=Math.random()*Math.PI*2, sp=Math.random()*8+3;
      parts.push({x:ox,y:oy,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-7,g:0.16,
        size:Math.random()*8+4,color:colors[i%colors.length],rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.5});
    }
    function frame(){
      ctx.clearRect(0,0,cvs.width,cvs.height);
      var alive=false;
      for(var i=0;i<parts.length;i++){
        var p=parts[i];
        p.vy+=p.g; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
        if(p.y<cvs.height+30) alive=true;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.62); ctx.restore();
      }
      if(alive) requestAnimationFrame(frame); else ctx.clearRect(0,0,cvs.width,cvs.height);
    }
    requestAnimationFrame(frame);
  }

  // The Collect tag field is always on screen, so its recent-tags list is shown
  // only while the field is focused (the pile/timer tag editors only exist when
  // open, so they show it on their own via tagDropHTML).
  document.addEventListener("focusin",function(ev){
    if(ev.target && ev.target.id==="tagin"){
      var dd=document.getElementById("tagdrop"); if(dd) dd.innerHTML=tagDropHTML();
    }
  });
  document.addEventListener("focusout",function(ev){
    if(ev.target && ev.target.id==="tagin"){
      setTimeout(function(){
        var ti=document.getElementById("tagin");
        if(ti && document.activeElement===ti) return;
        var dd=document.getElementById("tagdrop"); if(dd) dd.innerHTML="";
      },150);
    }
  });

  // iOS Safari throttles/suspends JS timers when the tab is backgrounded or the
  // screen locks; recompute the countdown from the wall clock the moment we're
  // back so it never drifts or stalls.
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) resyncTimer(); });
  window.addEventListener("pageshow",function(){ resyncTimer(); });
  window.addEventListener("focus",function(){ resyncTimer(); });

  document.addEventListener("click",function(ev){
    var el=ev.target;
    while(el && el!==document && !el.getAttribute){ el=el.parentNode; }
    while(el && el!==document && !el.getAttribute("data-act")){ el=el.parentNode; }
    if(!el || el===document) return;
    var a=el.getAttribute("data-act");
    var d=document.getElementById("dump");
    if(d) draft.text=d.value;
    var ti=document.getElementById("tmin");
    if(ti) timer.buf=ti.value;
    var em=document.getElementById("email");
    if(em) authEmail=em.value;
    var pw=document.getElementById("pass");
    if(pw) authPass=pw.value;
    if(a!=="edit-pill" && a!=="set-pill" && editPill){ editPill=null; }

    if(a==="auth-toggle"){
      authMode=(authMode==="signup"?"signin":"signup");
      authMsg=""; render();
    }
    else if(a==="auth-submit"){
      if(!sb) return;
      var email=(authEmail||"").replace(/^\s+|\s+$/g,"");
      var pass=authPass||"";
      if(!email || !pass){ authMsg="Enter your email and password."; render(); return; }
      authBusy=true; authMsg=""; render();
      if(authMode==="signup"){
        sb.auth.signUp({email:email,password:pass}).then(function(res){
          authBusy=false;
          if(res.error){ authMsg=res.error.message; render(); return; }
          if(res.data && res.data.session){ render(); }
          else {
            authMode="signin"; authPass="";
            authMsg="Check your email to confirm your account, then sign in.";
            render();
          }
        });
      } else {
        sb.auth.signInWithPassword({email:email,password:pass}).then(function(res){
          authBusy=false;
          if(res.error){ authMsg=res.error.message; render(); return; }
          render();
        });
      }
    }
    else if(a==="signout"){
      menuOpen=false;
      if(sb) sb.auth.signOut();
    }
    else if(a==="menu-toggle"){ menuOpen=!menuOpen; render(); }
    else if(a==="menu-close"){ menuOpen=false; render(); }
    else if(a==="hist-back"){ try{ history.back(); }catch(e){} }
    else if(a==="nav"){ flash=""; setScreen(el.getAttribute("data-to")); }
    else if(a==="chip"){
      var dim=el.getAttribute("data-dim"), val=el.getAttribute("data-val");
      if(el.getAttribute("data-multi")==="1"){
        var arr=filters[dim], k=arr.indexOf(val);
        if(k>-1) arr.splice(k,1); else arr.push(val);
      } else {
        draft[dim]=val;
      }
      render();
    }
    else if(a==="pchip"){
      var fdim=el.getAttribute("data-dim"), fval=el.getAttribute("data-val");
      var farr=pileFilters[fdim], fk=farr.indexOf(fval);
      if(fk>-1) farr.splice(fk,1); else farr.push(fval);
      render();
    }
    else if(a==="pflag"){
      var fflag=el.getAttribute("data-flag");
      pileFilters[fflag]=!pileFilters[fflag];
      render();
    }
    else if(a==="pfilter-toggle"){ pileFilterOpen=!pileFilterOpen; render(); }
    else if(a==="pfilter-clear"){
      pileFilters={priority:[],urgency:[],energy:[],time:[],context:[],when:[],tags:[],must:false,d3:false};
      render();
    }
    else if(a==="pfilter-choose"){
      var ppool=pileMatching(openTasks());
      var pchosen=pickOne(ppool,null);
      if(!pchosen) return;
      method="pilefilter"; resetTimer(); setScreen("focus", pchosen.id);
    }
    else if(a==="add"){
      if(!canAdd() || !sb || !user) return;
      var v=(draft.text||"").replace(/^\s+|\s+$/g,"");
      var row={text:v,priority:draft.p||null,urgency:draft.u||null,
               energy:draft.e||null,time:draft.t||null,context:draft.c||null,
               horizon:draft.w||null,tags:draft.tags.slice(),done:false,must:!!draft.must,user_id:user.id};
      // Optimistic: clear + refocus instantly so the next task can be typed
      // immediately; the save happens in the background.
      draft=freshDraft(); tagQuery="";
      flash="Added to the pile."; render();
      var nd=document.getElementById("dump"); if(nd) nd.focus();
      setTimeout(function(){
        if(flash!=="Added to the pile.") return;
        flash="";
        var fl=document.querySelector(".flash");
        if(fl && fl.parentNode) fl.parentNode.removeChild(fl);
      },900);
      insertTask(row).then(function(res){
        if(res && res.error){
          flash="Couldn't save: "+res.error.message;
          if(!draft.text.replace(/\s/g,"")) draft.text=v;   // restore lost text if box is empty
          render();
          var ne=document.getElementById("dump"); if(ne) ne.focus();
          return;
        }
        tasks.unshift(normalize(res.data));
        // Enable the pile buttons without a full render (keeps textarea focus).
        if(screen==="collect"){
          var b1=document.querySelector('[data-act="go-pile"]');
          var b2=document.querySelector('[data-act="go-choose"]');
          if(b1) b1.removeAttribute("disabled");
          if(b2) b2.removeAttribute("disabled");
        } else { render(); }
      });
    }
    else if(a==="del"){
      var id=el.getAttribute("data-id");
      if(!sb) return;
      sb.from("tasks").delete().eq("id",id).then(function(res){
        if(res.error){ flash="Couldn't delete: "+res.error.message; render(); return; }
        tasks=tasks.filter(function(t){ return String(t.id)!==String(id); });
        render();
      });
    }
    else if(a==="complete-row"){
      var qid=el.getAttribute("data-id"), qt=findTask(qid);
      if(!qt || !sb || qt.done) return;
      qt.done=true; qt.doneAt=Date.now(); flash="Completed."; completeChime(); render();
      var whenISO=new Date().toISOString();
      sb.from("tasks").update({done:true,done_at:whenISO}).eq("id",qid).then(function(res){
        if(res.error && /done_at/i.test(res.error.message||"")) return sb.from("tasks").update({done:true}).eq("id",qid);
        return res;
      }).then(function(res){
        if(res && res.error){ qt.done=false; qt.doneAt=null; flash="Couldn't complete: "+res.error.message; render(); }
      });
      setTimeout(function(){ if(flash==="Completed."){ flash=""; render(); } },1400);
    }
    else if(a==="inbox-keep"){
      var kid=el.getAttribute("data-id"), kt=findTask(kid);
      if(kt && sb){
        kt.inbox=false; render();
        sb.from("tasks").update({inbox:false}).eq("id",kid).then(function(res){
          if(res.error){ kt.inbox=true; flash="Couldn't move: "+res.error.message; render(); }
        });
      }
    }
    else if(a==="toggle-must"){ draft.must=!draft.must; render(); }
    else if(a==="toggle-must-row"){
      var mid=el.getAttribute("data-id"), mt=findTask(mid);
      if(mt && sb){
        var mold=!!mt.must; mt.must=!mold; render();
        sb.from("tasks").update({must:mt.must}).eq("id",mid).then(function(res){
          if(res.error){ mt.must=mold; flash="Couldn't update: "+res.error.message; render(); }
        });
      }
    }
    else if(a==="toggle-d3-row"){
      var rid=String(el.getAttribute("data-id")), darr=dayBig3().slice(), pos=-1;
      for(var z=0;z<darr.length;z++){ if(String(darr[z])===rid){ pos=z; break; } }
      if(pos>-1){ darr.splice(pos,1); setDayBig3(darr); flash=""; render(); }
      else if(darr.length>=3){ flash="Daily Big 3 is full (3). Remove one first."; render();
        setTimeout(function(){ if(flash==="Daily Big 3 is full (3). Remove one first."){ flash=""; render(); } },2000); }
      else { darr.push(rid); setDayBig3(darr); flash=""; render(); }
    }
    else if(a==="d3-add"){
      var aid=String(el.getAttribute("data-id")), aarr=dayBig3().slice();
      if(aarr.length<3 && !inDayBig3(aid)){ aarr.push(aid); setDayBig3(aarr); }
      planPick=false; render();
    }
    else if(a==="d3-remove"){
      var xid=String(el.getAttribute("data-id"));
      setDayBig3(dayBig3().filter(function(x){ return String(x)!==xid; }));
      render();
    }
    else if(a==="d3-pick-open"){ planPick=true; render(); }
    else if(a==="d3-pick-close"){ planPick=false; render(); }
    else if(a==="d3-carry"){
      var yKey=dayKey(new Date(Date.now()-86400000)),
          yd=(plans.days[yKey]&&Array.isArray(plans.days[yKey].big3))?plans.days[yKey].big3:[], carry=[];
      for(var yy=0;yy<yd.length && carry.length<3;yy++){ var yt2=findTask(yd[yy]); if(yt2 && !yt2.done) carry.push(String(yt2.id)); }
      setDayBig3(carry); render();
    }
    else if(a==="d3-done"){
      var cid=el.getAttribute("data-id"), ct=findTask(cid);
      if(!ct || !sb) return;
      var was=!!ct.done;
      ct.done=!was; ct.doneAt=was?null:Date.now(); render();
      if(!was){
        var whenISO=new Date().toISOString();
        sb.from("tasks").update({done:true,done_at:whenISO}).eq("id",cid).then(function(res){
          if(res.error && /done_at/i.test(res.error.message||"")) return sb.from("tasks").update({done:true}).eq("id",cid);
          return res;
        }).then(function(res){ if(res && res.error){ ct.done=false; ct.doneAt=null; flash="Couldn't complete: "+res.error.message; render(); } });
      } else {
        sb.from("tasks").update({done:false,done_at:null}).eq("id",cid).then(function(res){
          if(res.error && /done_at/i.test(res.error.message||"")) return sb.from("tasks").update({done:false}).eq("id",cid);
          return res;
        }).then(function(res){ if(res && res.error){ ct.done=true; flash="Couldn't update: "+res.error.message; render(); } });
      }
    }
    else if(a==="wk-add"){
      var wia=document.getElementById("wknew"); if(wia) wkNewBuf=wia.value;
      var wv=normTag(wkNewBuf), warr=weekBig3().slice();
      if(wv && warr.length<3){ warr.push(wv); setWeekBig3(warr); }
      wkNewBuf=""; render();
      var wib=document.getElementById("wknew"); if(wib){ try{ wib.focus(); }catch(e){} }
    }
    else if(a==="wk-edit"){
      wkEdit=parseInt(el.getAttribute("data-idx"),10); var wke=weekBig3(); wkBuf=wke[wkEdit]||""; render();
      var wic=document.getElementById("wkin"); if(wic){ try{ wic.focus(); wic.select(); }catch(e){} }
    }
    else if(a==="wk-save"){
      var wid=document.getElementById("wkin"); if(wid) wkBuf=wid.value;
      var wv2=normTag(wkBuf), warr2=weekBig3().slice();
      if(wkEdit!=null && wkEdit>-1 && wkEdit<warr2.length){
        if(wv2){ warr2[wkEdit]=wv2; } else { warr2.splice(wkEdit,1); }
        setWeekBig3(warr2);
      }
      wkEdit=null; render();
    }
    else if(a==="wk-cancel"){ wkEdit=null; render(); }
    else if(a==="wk-remove"){
      var wri=parseInt(el.getAttribute("data-idx"),10), warr3=weekBig3().slice();
      if(wri>-1 && wri<warr3.length){ warr3.splice(wri,1); setWeekBig3(warr3); }
      render();
    }
    else if(a==="go-choose"){ flash=""; setScreen("choose"); }
    else if(a==="go-pile"){ flash=""; setScreen("pile"); }
    else if(a==="edit-pill"){
      editPill={id:el.getAttribute("data-id"),dim:el.getAttribute("data-dim")};
      render();
    }
    else if(a==="set-pill"){
      var pid=el.getAttribute("data-id"), pdim=el.getAttribute("data-dim"), pval=el.getAttribute("data-val");
      editPill=null;
      var pf=DIMFIELD[pdim], pt=findTask(pid);
      if(pt && pt[pf]!==pval && sb){
        var pold=pt[pf]; pt[pf]=pval; render();
        var upd={}; upd[pf]=pval;
        sb.from("tasks").update(upd).eq("id",pid).then(function(res){
          if(res.error){ pt[pf]=pold; flash="Couldn't update: "+res.error.message; render(); }
        });
      } else { render(); }
    }
    else if(a==="set-default"){
      var ddim=el.getAttribute("data-dim");
      defaults[ddim]=el.getAttribute("data-val");
      if(!draft.text.replace(/\s/g,"")) draft=freshDraft();
      saveSettings();
      render();
    }
    else if(a==="set-sound"){
      timerSound=el.getAttribute("data-sound");
      saveMins();
      playSound(timerSound);   // preview
      render();
    }
    else if(a==="tag-pick"){ addDraftTag(el.getAttribute("data-tag")); }
    else if(a==="tag-add"){
      var tn=normTag(el.getAttribute("data-tag"));
      if(tn){ createTag(tn); addDraftTag(tagExact(tn)||tn); }
    }
    else if(a==="tag-remove"){
      var rt=el.getAttribute("data-tag");
      draft.tags=draft.tags.filter(function(x){ return !tagEq(x,rt); });
      refreshTagBox();
    }
    else if(a==="tag-create"){ tagCreateFromSettings(); }
    else if(a==="tag-edit"){
      tagEdit=el.getAttribute("data-tag"); tagEditBuf=tagEdit; render();
      var ri=document.getElementById("tagren"); if(ri){ try{ ri.focus(); ri.select(); }catch(e){} }
    }
    else if(a==="tag-rename-save"){ tagRenameSave(); }
    else if(a==="tag-rename-cancel"){ tagEdit=null; render(); }
    else if(a==="tag-del"){
      var dt=el.getAttribute("data-tag");
      tagVocab=tagVocab.filter(function(x){ return !tagEq(x,dt); });
      filters.tags=filters.tags.filter(function(x){ return !tagEq(x,dt); });
      retagTasks(dt,null); saveSettings(); render();
    }
    else if(a==="title-edit"){
      var te=findTask(el.getAttribute("data-id")); if(!te) return;
      rowTagEdit=null; titleEdit=te.id; titleBuf=te.text; render();
      var tin=document.getElementById("titlein"); if(tin){ try{ tin.focus(); tin.select(); }catch(e){} }
    }
    else if(a==="title-save"){ titleSave(); }
    else if(a==="title-cancel"){ titleEdit=null; render(); }
    else if(a==="focus-edit"){
      var fe=findTask(activeId); if(!fe) return;
      focusEdit=true; titleEdit=fe.id; titleBuf=fe.text; rowTagEdit=null; rowTagQuery=""; render();
      var fin=document.getElementById("titlein"); if(fin){ try{ fin.focus(); fin.select(); }catch(e){} }
    }
    else if(a==="focus-edit-done"){ focusEditDone(); }
    else if(a==="tag-row-open"){
      titleEdit=null; rowTagEdit=el.getAttribute("data-id"); rowTagQuery=""; render();
      var rin=document.getElementById("rowtagin"); if(rin){ try{ rin.focus(); }catch(e){} }
    }
    else if(a==="tag-row-pick"){ attachRowTag(el.getAttribute("data-id"), el.getAttribute("data-tag")); }
    else if(a==="tag-row-add"){
      var rn=normTag(el.getAttribute("data-tag")); if(!rn) return;
      createTag(rn); attachRowTag(el.getAttribute("data-id"), tagExact(rn)||rn);
    }
    else if(a==="tag-row-remove"){ removeRowTag(el.getAttribute("data-id"), el.getAttribute("data-tag")); }
    else if(a==="sec"){
      var sc=el.getAttribute("data-sec");
      openSec=(openSec===sc?"":sc);
      render();
    }
    else if(a==="deal-ctx"){
      var ctx=el.getAttribute("data-ctx");
      var pool=openTasks().filter(function(t){ return t.context===ctx; });
      var td=pickOne(pool,null);
      if(!td) return;
      method="deal"; dealCtx=ctx; resetTimer(); setScreen("focus", td.id);
    }
    else if(a==="show-one"){
      var t1=pickOne(matching(),null);
      if(!t1) return;
      method="filter"; resetTimer(); setScreen("focus", t1.id);
    }
    else if(a==="pick"){
      // A stray tap while an inline editor is open just closes the editor.
      if(titleEdit!=null || rowTagEdit!=null){ titleEdit=null; rowTagEdit=null; rowTagQuery=""; render(); return; }
      method="pick"; resetTimer();
      setScreen("focus", el.getAttribute("data-id"));
    }
    else if(a==="toggle"){
      if(timer.editing) return;
      if(timer.run){ stopTimer(); }
      else { flash=""; getAudio(); startTimer(); }
      render();
    }
    else if(a==="settime"){
      stopTimer();
      timer.editing=true; timer.buf=String(timer.mins); render();
      var inp=document.getElementById("tmin");
      if(inp){ try{ inp.focus(); inp.select(); }catch(e){} }
    }
    else if(a==="settime-done"){ commitTime(); }
    else if(a==="done"){
      var did=activeId;
      if(!sb) return;
      stopTimer();
      completeChime();
      confettiBurst();
      var whenISO=new Date().toISOString();
      sb.from("tasks").update({done:true,done_at:whenISO}).eq("id",did).then(function(res){
        if(res.error && /done_at/i.test(res.error.message||"")){
          return sb.from("tasks").update({done:true}).eq("id",did);
        }
        return res;
      }).then(function(res){
        if(res && res.error){ flash="Couldn't mark done: "+res.error.message; }
        else {
          tasks=tasks.map(function(t){
            if(String(t.id)!==String(did)) return t;
            t.done=true; t.doneAt=Date.now(); return t;
          });
        }
        if(screen==="choose") render();
      });
      setTimeout(function(){
        var msg;
        if(!bucketIsRandom()){
          // Specific task: back to the task list to choose the next one.
          msg="Done. Pick your next."; flash=msg; gotoPickList();
        } else {
          var nx=pickOne(bucketPool().filter(function(t){ return String(t.id)!==String(did); }),null);
          if(nx){ msg="Done. Next up."; flash=msg; advanceTo(nx.id); }
          else { msg="Done. That was the last one here."; flash=msg; setScreen("choose", null); }
        }
        setTimeout(function(){ if(flash===msg){ flash=""; render(); } },2600);
      },1100);
    }
    else if(a==="another"){
      if(!bucketIsRandom()){ gotoPickList(); return; }   // specific pick → back to the task list
      var alt=bucketPool().filter(function(t){ return String(t.id)!==String(activeId); });
      if(!alt.length){ flash="Nothing else in this bucket."; render(); return; }
      var nx=pickOne(alt,null);
      if(!nx) return;
      flash=""; advanceTo(nx.id);
    }
    else if(a==="switch-bucket"){ setScreen("choose", null); }
  });

  window.addEventListener("popstate",function(ev){
    var st=ev.state||{};
    screen=st.screen||"collect";
    activeId=st.activeId||null;
    menuOpen=false; editPill=null; timer.editing=false; rowTagEdit=null; titleEdit=null; focusEdit=false; planPick=false; wkEdit=null;
    if(screen==="focus") resetTimer(); else stopTimer();
    render();
  });

  function applySession(s){
    var u = (s && s.user) ? s.user : null;
    var newId = u ? u.id : null;
    if(newId===authedId) return;
    authedId=newId;
    user=u;
    authEmail=""; authPass=""; authMsg=""; authBusy=false; flash="";
    if(u){
      booting=true; render();
      Promise.all([loadTasks(), loadSettings()]).then(function(){
        booting=false;
        draft=freshDraft();
        screen="collect"; activeId=null;
        try{ history.replaceState({screen:"collect",activeId:null},""); }catch(e){}
        render();
      }).catch(function(err){ booting=false; flash="Couldn't load tasks: "+errmsg(err); render(); });
    } else {
      tasks=[]; screen="collect"; activeId=null; booting=false; render();
    }
  }

  loadMins();
  render();
  if(!sb){
    booting=false;
    authMsg="Supabase client failed to load (check your connection).";
    render();
  } else {
    sb.auth.onAuthStateChange(function(_e,s){ setTimeout(function(){ applySession(s); },0); });
    sb.auth.getSession().then(function(res){
      applySession(res && res.data ? res.data.session : null);
    }).catch(function(err){
      booting=false; authMsg="Auth error: "+errmsg(err); render();
    });
  }
})();
</script>
</body>
</html>
